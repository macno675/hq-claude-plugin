<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przykład widoku w stylu (hq:look)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font: var(--size-body)/var(--lh-body) var(--font-text); }
  header, main, footer { padding: 0 var(--space-3); max-width: 1120px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
  .logo { font: 600 1.125rem var(--font-display); color: var(--color-text); text-decoration: none; padding: var(--space-2) 0; }
  nav a { color: var(--color-text); padding: var(--space-3) var(--space-2); display: inline-block; text-decoration: none; transition: text-decoration-color var(--dur-fast) var(--ease-out); text-decoration-line: underline; text-decoration-color: transparent; }
  nav a:hover, nav a:focus-visible { text-decoration-color: var(--color-accent); }
  h1 { font: 600 var(--size-display)/var(--lh-tight) var(--font-display); letter-spacing: var(--track-display); margin: var(--space-5) 0 var(--space-3); }
  h2 { font: 600 var(--size-heading)/var(--lh-tight) var(--font-display); margin: 0 0 var(--space-3); }
  .label { font-size: var(--size-label); text-transform: uppercase; letter-spacing: var(--track-label); color: var(--color-text-muted); }
  section { margin-top: var(--section-gap); }
  .price { font-variant-numeric: tabular-nums; font-size: var(--size-heading); }
  .card { background: var(--color-surface); border-radius: var(--radius-m); padding: var(--space-4); box-shadow: var(--shadow-1); }
  form { display: grid; gap: var(--space-3); max-width: 420px; }
  label { display: grid; gap: var(--space-1); }
  input { font: inherit; padding: var(--space-2) var(--space-3); min-height: 44px; border: 1px solid var(--color-line); border-radius: var(--radius-s); background: var(--color-bg); color: var(--color-text); }
  input:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .btn { font: 600 var(--size-body) var(--font-text); min-height: 44px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-s); background: var(--color-accent); color: var(--color-on-accent); cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  .btn:hover { background: var(--color-accent-hover); }
  .btn:active { transform: translateY(1px); }
  .error { color: var(--color-danger); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header><a class="logo" href="#" data-logo>Acme</a><nav><a href="#oferta">Oferta</a><a href="#kontakt">Kontakt</a></nav></header>
<main>
  <p class="label">Pokoje i domki</p>
  <h1>Cisza nad jeziorem, dwie godziny od miasta</h1>
  <section id="oferta" class="card">
    <h2>Domek przy pomoście</h2>
    <p>4 osoby, kominek, łódka w cenie. Zameldowanie od 15:00.</p>
    <p class="price">420 zł <span class="label">za noc</span></p>
  </section>
  <section id="kontakt">
    <h2>Zapytaj o termin</h2>
    <form>
      <label>Imię <input name="imie" autocomplete="given-name"></label>
      <label>E-mail <input name="email" type="email" autocomplete="email"></label>
      <p class="error">Podaj adres e-mail, odpiszemy w ciągu doby.</p>
      <button class="btn" type="submit">Wyślij zapytanie</button>
    </form>
  </section>
</main>
<footer><p class="label">Acme · ul. Leśna 1</p></footer>
</body>
</html>
